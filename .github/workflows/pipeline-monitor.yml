name: Retail pipeline quality
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m src.generate_data --output data/synthetic_sales.csv --rows 10000 --stores 500
      - run: python -m src.pipeline --input data/synthetic_sales.csv --output outputs
      - run: python -m src.quality_report --input data/synthetic_sales.csv --output outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retail-pipeline-reports
          path: outputs/
          if-no-files-found: warn
